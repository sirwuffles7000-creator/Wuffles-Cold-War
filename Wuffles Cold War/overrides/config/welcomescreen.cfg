# Configuration file

behavior {
    # Master toggle. If false, the welcome screen is never shown. [default: true]
    B:enabled=true

    # If true, the welcome screen will pause the game while open (client-side pause behavior). [default: true]
    B:pauseGame=true

    # If true, the welcome screen is shown on every login.
    # If false, it is only shown until the player has accepted once. [default: false]
    B:showEveryLogin=false
}


delay {
    # Number of seconds before ACCEPT becomes clickable (when delay applies). [range: 0 ~ 3600, default: 15]
    I:acceptDelaySeconds=15

    # If false, REFUSE is also disabled until the delay ends. [default: true]
    B:allowRefuseDuringDelay=true

    # If true, the accept delay applies even when showEveryLogin=true and the player already accepted before.
    # If false, delay only applies when the player must accept for the first time. [default: false]
    B:applyDelayEveryLogin=false

    # Prominent countdown text shown while ACCEPT is locked.
    # Must contain a %d for remaining seconds. [default: You can close this screen in %d seconds.]
    S:bigCountdownTextFormat=You can close this screen in %d seconds.

    # If true, the ACCEPT button is disabled for a number of seconds. [default: true]
    B:enableAcceptDelay=true
}


info_menu {
    # If true, shows a third button on the main page that opens an info menu (categories + subpages).
    # The pages are configured in config/welcomescreen_pages.json [default: true]
    B:enableInfoButton=true

    # Label for the optional third button on the main page. [default: MODS / PLUGINS INFO]
    S:infoButtonText=MODS / PLUGINS INFO

    # Title shown at the top of the info menu and subpages. [default: Information]
    S:infoMenuTitle=Information
}


messages {
    # Kick message shown if a client attempts to accept before the delay ends (server-enforced). [default: Please wait before accepting.]
    S:earlyAcceptKickMessage=Please wait before accepting.

    # Kick message shown when the player refuses. [default: You must accept the server rules to play.]
    S:refusalKickMessage=You must accept the server rules to play.
}


text {
    # Label for the ACCEPT button. [default: ACCEPT]
    S:acceptButtonText=ACCEPT

    # Lines shown in the body area on the main page. Supports blank lines. Long lines will wrap.
    # Mouse wheel scrolls. [default: [Server Rules / Info (edit this in config/welcomescreen.cfg):], [- Be respectful.], [- No cheating or exploiting.], [- Follow staff instructions.], [], [Tip: Keep this short enough to fit your screen, or rely on scrolling.]]
    S:bodyLines <
        Server Rules / Info (edit this in config/welcomescreen.cfg):
        - Be respectful.
        - No cheating or exploiting.
        - Follow staff instructions.
        
        Tip: Keep this short enough to fit your screen, or rely on scrolling.
     >

    # If true, body text is centered. If false, body text is left-aligned (recommended for long text). [default: false]
    B:centerBodyText=false

    # Label for the REFUSE button. [default: REFUSE]
    S:refuseButtonText=REFUSE

    # Subtitle shown below the title. [default: Please read the information below, then choose Accept or Refuse.]
    S:subtitle=Please read the information below, then choose Accept or Refuse.

    # Main title shown on the welcome screen. [default: Welcome]
    S:title=Welcome
}


